name: Build Android APK & Gemini Auto-Fix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android Licenses & Set SDK Path
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Generate Custom Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass releasePass -keypass releasePass -dname "CN=PromptFlutuante, OU=Dev, O=UmDoisLab, L=SP, C=BR"

    - name: Build Release APK
      id: gradle_build
      continue-on-error: true
      run: gradle assembleRelease --stacktrace

    - name: Sign Release APK
      if: steps.gradle_build.outcome == 'success'
      run: |
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:releasePass --key-pass pass:releasePass app/build/outputs/apk/release/app-release.apk

    - name: Analyze Error with Gemini API (if build fails)
      if: steps.gradle_build.outcome == 'failure'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "O build falhou. Enviando erro para o Gemini..."
        ERROR_LOG=$(gradle assembleRelease --stacktrace 2>&1 | tail -n 100 || echo "Erro durante a compilação do Gradle.")
        
        curl -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
        -H 'Content-Type: application/json' \
        -d "{
          \"contents\": [{
            \"parts\":[{\"text\": \"Análise o seguinte erro de compilação Android e explique a solução de forma sucinta:\n\n${ERROR_LOG}\"}]
          }]
        }" -o gemini_analysis.json

        cat gemini_analysis.json

    - name: Upload APK Artifact
      if: steps.gradle_build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed.apk
        path: app/build/outputs/apk/release/app-release.apk
